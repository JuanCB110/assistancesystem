<div class="carreras-container">
  <div class="header-section">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar carrera</mat-label>
      <input matInput [(ngModel)]="searchTerm" (input)="filterCarreras()" placeholder="Nombre">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>add_circle</mat-icon>
      Nuevo
    </button>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <div class="table-container">
        <table mat-table [dataSource]="carrerasFiltradas" class="carreras-table">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let carrera">{{carrera.nombre}}</td>
          </ng-container>
          <ng-container matColumnDef="duracion">
            <th mat-header-cell *matHeaderCellDef>Duración (semestres)</th>
            <td mat-cell *matCellDef="let carrera">{{carrera.semestres || '-'}}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let carrera">
              <button mat-icon-button color="primary" (click)="openForm(carrera)" matTooltip="Editar carrera">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDelete(carrera)" matTooltip="Eliminar carrera">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <div *ngIf="carrerasFiltradas.length === 0" class="no-data">
          <mat-icon>school</mat-icon>
          <p>No se encontraron carreras</p>
        </div>
        <div *ngIf="loading" class="loading-overlay">
          <mat-spinner></mat-spinner>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="form-overlay" *ngIf="showForm" (click)="closeForm()">
    <mat-card class="form-modal" (click)="$event.stopPropagation()">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>{{isEditing ? 'edit' : 'add_circle'}}</mat-icon>
          {{isEditing ? 'Editar Carrera' : 'Nueva Carrera'}}
        </mat-card-title>
        <button mat-icon-button class="close-btn" (click)="closeForm()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-card-header>
      <mat-card-content>
        <form class="carrera-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombre de la Carrera</mat-label>
            <input matInput [(ngModel)]="newCarrera" name="newCarrera" required>
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Duración (semestres)</mat-label>
            <input matInput type="number" [(ngModel)]="duracion" name="duracion">
          </mat-form-field>
        </form>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button (click)="closeForm()">Cancelar</button>
        <button mat-raised-button color="primary" (click)="crearCarrera()" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">{{isEditing ? 'Actualizar' : 'Crear'}}</span>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
