<div class="aulas-container">
  <div class="header-section">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar aula</mat-label>
      <input matInput [(ngModel)]="searchTerm" (input)="filterAulas()" placeholder="Número o edificio">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>add_circle</mat-icon>
      Nuevo
    </button>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <div class="table-container">
        <table mat-table [dataSource]="aulasFiltradas" class="aulas-table">
          <ng-container matColumnDef="numero">
            <th mat-header-cell *matHeaderCellDef>Número</th>
            <td mat-cell *matCellDef="let aula">{{aula.numero}}</td>
          </ng-container>
          <ng-container matColumnDef="edificio">
            <th mat-header-cell *matHeaderCellDef>Edificio</th>
            <td mat-cell *matCellDef="let aula">{{getEdificioNombre(aula.edificio_id)}}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let aula">
              <button mat-icon-button color="primary" (click)="openForm(aula)" matTooltip="Editar aula">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDelete(aula)" matTooltip="Eliminar aula">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <div *ngIf="aulasFiltradas.length === 0" class="no-data">
          <mat-icon>meeting_room</mat-icon>
          <p>No se encontraron aulas</p>
        </div>
        <div *ngIf="loading" class="loading-overlay">
          <mat-spinner></mat-spinner>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="form-overlay" *ngIf="showForm" (click)="closeForm()">
    <mat-card class="form-modal" (click)="$event.stopPropagation()">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>{{isEditing ? 'edit' : 'add_circle'}}</mat-icon>
          {{isEditing ? 'Editar Aula' : 'Nueva Aula'}}
        </mat-card-title>
        <button mat-icon-button class="close-btn" (click)="closeForm()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-card-header>
      <mat-card-content>
        <form class="aula-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Número de Aula</mat-label>
            <input matInput [(ngModel)]="newAula" name="newAula" required>
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Edificio</mat-label>
            <mat-select [(value)]="selectedEdificioId">
              <mat-option *ngFor="let edificio of edificios" [value]="edificio.id">
                {{edificio.nombre}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </form>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button (click)="closeForm()">Cancelar</button>
        <button mat-raised-button color="primary" (click)="crearAula()" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">{{isEditing ? 'Actualizar' : 'Crear'}}</span>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
